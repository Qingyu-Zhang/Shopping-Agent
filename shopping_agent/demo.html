<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Agent</title>
<style>
:root{font:16px Inter,system-ui,sans-serif;color:#182529;background:#f5f8f6;--green:#146653;--line:#d3dfd9}
*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid var(--line)}
nav,main{max-width:980px;margin:auto;padding:20px 28px}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
nav strong{margin-right:auto;color:var(--green);font-size:1.1rem}main{padding-top:40px}
h1,h2,h3,p{margin:0}h1{font-size:clamp(2rem,5vw,3rem);letter-spacing:-.05em}
h2{font-size:1.28rem;margin:22px 0 12px}h3{font-size:1.07rem}
section{margin-top:20px}form,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
label{font-weight:650;display:block;margin-bottom:8px}
input,select,button,textarea{font:inherit}textarea,input,select{border:1px solid #a6b6ae;border-radius:7px;padding:9px;color:inherit;background:#fff}
textarea{width:100%;resize:vertical;min-height:86px}
select,button{min-height:39px}button{cursor:pointer;background:var(--green);color:white;border:0;border-radius:8px;padding:8px 14px;font-weight:600}
button.secondary{background:#e9f4ee;color:#124b3a}button:disabled{opacity:.6;cursor:wait}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:12px}
#response,#notice{white-space:pre-line;line-height:1.55}#notice{padding-top:10px;color:#78431f}
.card{margin-top:10px}.card p,.card li{line-height:1.5;margin-top:7px}.muted{color:#475d57}
code{overflow-wrap:anywhere}a{color:var(--green)}svg{vertical-align:middle}
</style>
</head>
<body>
<header><nav>
<strong>Shopping Agent</strong>
<label for="account" style="margin:0">Demo account</label>
<select id="account"><option value="alex">Alex</option><option value="sam">Sam</option></select>
<button class="secondary" id="new-task">New task</button>
<a href="/docs">API docs</a>
</nav></header>
<main>
<h1>Find the right combination</h1>
<section>
<form id="turn">
<label for="message">What are you shopping for?</label>
<textarea id="message" required maxlength="2200" placeholder="Find a lightweight laptop and a dock for a 4K 60 Hz monitor under $1,000 total."></textarea>
<div class="row"><label for="reference">Reference image</label><input id="reference" type="file" accept="image/jpeg,image/png,image/webp"></div>
<div class="row"><button id="send">Send</button><button type="button" class="secondary" id="example">Use example</button>
<button type="button" class="secondary" id="voice" hidden>Use microphone</button></div>
</form>
<p aria-live="polite" id="notice"></p>
</section>
<section aria-live="polite" id="results"></section>
<section id="commerce"></section>
<section class="row">
<button type="button" class="secondary" id="cart">View cart</button>
<button type="button" class="secondary" id="orders">Orders and returns</button>
<button type="button" class="secondary" id="watches">Price alerts</button>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
const money = cents => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(cents/100);
const date = unix => new Date(unix*1000).toLocaleString();
const wait = ms => new Promise(resolve => setTimeout(resolve,ms));
let task = null, pending = null, view = 0, activeTurn = null;
async function api(path, method='GET', body) {
  const response = await fetch(path,{method,headers:{Authorization:'Bearer demo-'+$('account').value,
    ...(body===undefined ? {} : {'Content-Type':'application/json'})},body:body===undefined ? undefined : JSON.stringify(body)});
  const data = await response.json();
  if (!response.ok) throw new Error(data.message || JSON.stringify(data.detail || data));
  return data;
}
function text(parent, tag, value, cls) {
  const el = document.createElement(tag);el.textContent=value;if(cls)el.className=cls;parent.append(el);return el;
}
function button(parent,label,fn) {
  const el=text(parent,'button',label);el.type='button';el.className='secondary';
  el.addEventListener('click',()=>perform(fn,el));return el;
}
async function perform(fn, control) {
  if(control) control.disabled=true;
  $('notice').textContent='';
  try { await fn(); } catch(error){ $('notice').textContent=error.message; }
  finally { if(control) control.disabled=false; }
}
function reset() {
  activeTurn?.abort();
  task=null;pending=null;view=0;
  $('results').replaceChildren();$('commerce').replaceChildren();$('notice').textContent='';
}
const example='Find a lightweight laptop and a dock that can drive a 4K 60 Hz monitor, under $1,000 total.';
$('example').addEventListener('click',()=>{$('message').value=example;$('message').focus();});
const SpeechRecognition=window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognition){
  $('voice').hidden=false;
  $('voice').addEventListener('click',()=>{
    const recognizer=new SpeechRecognition();
    recognizer.lang='en-US';recognizer.interimResults=false;
    recognizer.onresult=event=>{$('message').value=event.results[0][0].transcript;$('message').focus();};
    recognizer.onerror=()=>{$('notice').textContent='Speech input was unavailable.';};
    recognizer.start();
  });
}
$('new-task').addEventListener('click',reset);
$('account').addEventListener('change',reset);
function referenceImage(){
  const file=$('reference').files[0];
  if(!file) return Promise.resolve(null);
  if(file.size>8000000) throw new Error('Choose an image under 8 MB.');
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(',')[1]);
    reader.onerror=()=>reject(new Error('The reference image could not be opened.'));
    reader.readAsDataURL(file);
  });
}
async function runEvents(run, signal){
  const waiting=['queued','running'];
  if(!waiting.includes(run.state))return run;
  const area=$('results'), cards=new Map();
  const statuses={search:'Searching the catalog…',evidence:'Checking product details and reviews…',
    recommendations:'Preparing recommendations…'};
  let cursor=run.events?.at(-1)?.id||0;
  area.replaceChildren();
  for(let attempt=0;attempt<2 && !signal.aborted;attempt++){
    try{
      const response=await fetch('/v1/runs/'+run.id+'/events',{signal,headers:{
        Authorization:'Bearer demo-'+$('account').value,'Last-Event-ID':String(cursor)}});
      if(!response.ok || !response.body)break;
      const reader=response.body.getReader(), decoder=new TextDecoder();
      let buffer='';
      try{
        while(!signal.aborted){
          const {value,done}=await reader.read();
          if(done)break;
          buffer+=decoder.decode(value,{stream:true});
          let boundary;
          while((boundary=buffer.indexOf('\n\n'))>=0){
            const frame=buffer.slice(0,boundary);
            buffer=buffer.slice(boundary+2);
            const data=frame.split('\n').find(line=>line.startsWith('data: '));
            if(!data)continue;
            const event=JSON.parse(data.slice(6));
            cursor=event.id;
            if(['completed','needs_input','failed'].includes(event.state))return {...event,id:run.id};
            if(event.state==='stage'){
              $('notice').textContent=statuses[event.stage]||'Researching options…';
              for(const candidate of event.candidates||[]){
                if(cards.has(candidate.id))continue;
                const card=text(area,'article','','card');
                text(card,'h3',candidate.title);
                cards.set(candidate.id,text(card,'div',''));
              }
            }else if(event.state==='recommendation'&&cards.has(event.candidate_id)){
              const card=cards.get(event.candidate_id);
              card.replaceChildren();renderReason(card,event);
            }
          }
        }
      }finally{ await reader.cancel().catch(()=>{}); }
    }catch(error){ if(signal.aborted)return null; }
  }
  let current=run;
  for(let i=0;i<180 && !signal.aborted && waiting.includes(current.state);i++){
    await wait(550);
    if(!signal.aborted)current=await api('/v1/runs/'+run.id);
  }
  return signal.aborted?null:current;
}
async function runTurn() {
  const message=$('message').value.trim();
  if(!message) return;
  activeTurn?.abort();
  const controller=new AbortController();activeTurn=controller;
  const image=pending?null:await referenceImage();
  if(controller.signal.aborted)return;
  if(!task) task=await api('/v1/tasks','POST');
  const run = pending ? await api('/v1/runs/'+pending.run+'/clarification','POST',
                         {interrupt_id:pending.id,text:message})
                      : await api('/v1/tasks/'+task.id+'/turns','POST',
                         {text:message,expected_version:task.version,plan_version:view||null,
                          request_id:crypto.randomUUID(),image_base64:image});
  if(controller.signal.aborted)return;
  pending=null;$('message').value='';$('reference').value='';$('notice').textContent='Researching options…';
  const current=await runEvents(run,controller.signal);
  if(!current)return;
  $('notice').textContent='';
  if(current.state==='needs_input'){
    pending={run:current.id,id:current.interrupt.id};
    text($('results'),'p',current.interrupt.question);$('message').focus();return;
  }
  if(current.state!=='completed')throw new Error(current.error?.message || 'This run is still processing.');
  task.version=current.result.task_version;
  if(!current.result.preserve_plans) view=task.version;
  render(current.result);
}
$('turn').addEventListener('submit',event=>{event.preventDefault();perform(runTurn,$('send'));});
function selection(plan){return {task_id:task.id,plan_id:plan.id,plan_version:view||task.version};}
function renderReason(card,reason){
  if(!reason)return;
  text(card,'p',reason.reason);
  if(reason.tradeoff)text(card,'p',reason.tradeoff,'muted');
  if(reason.citations?.length){
    const details=text(card,'details','');text(details,'summary','Evidence');
    for(const proof of reason.citations)text(details,'p',proof.excerpt+' · '+proof.source+' · '+proof.scope,'muted');
  }
}
function render(result){
  const area=$('results');area.replaceChildren();text(area,'p',result.answer).id='response';
  const reasons=new Map((result.recommendations||[]).map(reason=>[reason.candidate_id,reason]));
  for(const [i,plan] of (result.plans||[]).entries()){
    const card=text(area,'article','', 'card');
    text(card,'h3','Option '+(i+1)+' · '+money(plan.quote.total));
    for(const line of plan.quote.lines)text(card,'p',line.title+' · '+line.variant+' · '+line.seller+' · '+date(line.eta));
    renderReason(card,reasons.get(plan.id));
    for(const item of plan.evidence)text(card,'p',item.text+' — '+item.source,'muted');
    const row=text(card,'div','', 'row');
    button(row,'Review checkout',()=>makeQuote({selection:selection(plan)}));
    button(row,'Add to cart',async()=>{
      const cart=await api('/v1/cart');
      await api('/v1/cart/changes','POST',{expected_version:cart.version,operation_id:crypto.randomUUID(),selection:selection(plan)});
      await showCart();
    });
    button(row,'Track price',()=>showWatch(plan,result.price_alert_target));
  }
  if(!(result.plans||[]).length){
    for(const product of (result.products||[]).slice(0,8)){
      const card=text(area,'article','','card');
      text(card,'h3',product.title);
      if(Number.isInteger(product.snapshot_price))text(card,'p','Catalog price snapshot · '+money(product.snapshot_price),'muted');
      renderReason(card,reasons.get(product.id));
      if(product.unverified_fields?.length)text(card,'p','To verify · '+product.unverified_fields.join(', '),'muted');
    }
    for(const order of result.orders||[])text(area,'p',order.id+' · '+money(order.total));
  }
  if(result.evidence?.length){
    const details=text(area,'details','');text(details,'summary','Customer review evidence');
    const highlights=result.review_highlights?.length ? result.review_highlights
      : result.evidence.map(review=>({excerpt:review.text,source:review.source}));
    for(const review of highlights)text(details,'p',review.excerpt+' — '+review.source);
  }
}
async function makeQuote(body){showQuote(await api('/v1/quotes','POST',body));}
function showQuote(receipt){
  const area=$('commerce');area.replaceChildren();const quote=receipt.quote;
  text(area,'h2','Review checkout');const card=text(area,'div','', 'card');
  for(const line of quote.lines)text(card,'p',line.quantity+' × '+line.title+' · '+line.seller+' · '+money(line.unit_price));
  text(card,'p','Total '+money(quote.total)+' · Address '+quote.address_id+' · Estimated by '+date(quote.eta));
  text(card,'p','Expires '+date(quote.expires_at),'muted');
  button(text(card,'div','', 'row'),'Confirm '+money(quote.total),async()=>{
    const attempt=await api('/v1/quotes/'+receipt.id+'/confirm','POST',{terms:receipt.terms});
    text(card,'p','Checking payment status…');
    for(let i=0;i<90;i++){
      const value=await api('/v1/checkouts/'+attempt.id);
      if(value.state==='requote'){showQuote(value.replacement);$('notice').textContent='The platform changed the quote. Review the new terms.';return;}
      if(value.state==='succeeded') {await showOrders();return;}
      if(value.state==='failed')throw new Error(value.code||'Checkout failed.');
      await wait(650);
    }
    text(card,'p','Payment is still processing. Check Orders for updates.');
  });
}
async function showCart(){
  const area=$('commerce');area.replaceChildren();text(area,'h2','Cart');
  const cart=await api('/v1/cart');
  if(!cart.lines.length){text(area,'p','Your cart is empty.');return;}
  const card=text(area,'div','', 'card');
  for(const line of cart.lines)text(card,'p',line.offer_id+' × '+line.quantity);
  button(text(card,'div','', 'row'),'Review cart checkout',()=>makeQuote({cart_version:cart.version}));
}
async function showOrders(){
  const area=$('commerce');area.replaceChildren();text(area,'h2','Orders');
  const orders=await api('/v1/orders');
  if(!orders.length){text(area,'p','No orders yet.');return;}
  for(const order of orders){
    const card=text(area,'div','', 'card');text(card,'h3',money(order.total)+' · '+date(order.created_at));
    for(const parcel of order.parcels)text(card,'p',parcel.seller+' · '+parcel.status+' · '+date(parcel.eta));
    for(const line of order.lines){
      if(!order.parcels.some(x=>x.status==='delivered'&&x.offer_ids.includes(line.offer_id)))continue;
      button(text(card,'div','', 'row'),'Check return for '+line.title,async()=>{
        const result=await api('/v1/orders/'+order.id+'/return-quotes','POST',{offer_id:line.offer_id,quantity:1});
        const detail=text(card,'div','', 'row');text(detail,'span','Estimated refund '+money(result.preview.refund));
        const reason=text(detail,'input','');reason.placeholder='Return reason';reason.setAttribute('aria-label','Return reason');
        button(detail,'Confirm return',async()=>{
          await api('/v1/return-quotes/'+result.id+'/confirm','POST',{terms:result.terms,reason:reason.value});
          detail.replaceChildren();text(detail,'span','Return requested.');
        });
      });
    }
  }
}
function showWatch(plan,target){
  const area=$('commerce');area.replaceChildren();text(area,'h2','Track bundle price');
  const row=text(area,'div','', 'row');const input=text(row,'input','');input.type='number';input.step='0.01';
  input.min='0.01';input.value=((target||plan.quote.total)/100).toFixed(2);input.setAttribute('aria-label','Target price in dollars');
  button(row,'Create alert',async()=>{
    await api('/v1/automations','POST',{mode:'notify',trigger:'price',threshold:Math.round(Number(input.value)*100),
      address_id:plan.quote.address_id,lines:plan.quote.lines.map(x=>({offer_id:x.offer_id,quantity:x.quantity}))});
    await showWatches();
  });
}
async function showWatches(){
  const area=$('commerce');area.replaceChildren();text(area,'h2','Price alerts');
  const [watches,notices]=await Promise.all([api('/v1/automations'),api('/v1/notices')]);
  if(!watches.length)text(area,'p','No automation is configured.');
  for(const watch of watches){
    const line=text(area,'div','', 'row');
    text(line,'span',watch.mode+' · '+watch.state+(watch.threshold?' · '+money(watch.threshold):''));
    if(watch.state==='active')button(line,'Cancel',async()=>{await api('/v1/automations/'+watch.id,'DELETE');await showWatches();});
  }
  for(const notice of notices)text(area,'p',notice.title+' · '+money(notice.total));
}
$('cart').addEventListener('click',()=>perform(showCart,$('cart')));
$('orders').addEventListener('click',()=>perform(showOrders,$('orders')));
$('watches').addEventListener('click',()=>perform(showWatches,$('watches')));
</script>
</body>
</html>
